# SonarQube Cloud Automatic Analysis settings. SonarQube Cloud reads this
# file from the default branch.

# BREXX runs on MVS 3.8j (S/370), compiled by cc370: big-endian, int, long
# and pointers 32 bits, char unsigned, 24-bit addresses. Without a target the
# analyzer assumes a 64-bit host and reports every pointer <-> 32-bit integer
# cast as a truncation, although the high byte of an address word is free on
# this system and carries the end-of-list bit of MVS parameter lists.
# Clang has no 32-bit S/370 target (systemz/s390x are 64-bit only), so use
# the closest ILP32 one: 32-bit PowerPC is big-endian with unsigned char.
# The bare-metal EABI variant also matches cc370's size_t and ptrdiff_t
# (unsigned long / long; powerpc-linux-gnu makes them unsigned int / int)
# and defines no OS macros. mbt's compiledb uses the same triple,
# powerpc-unknown-eabi.
sonar.cfamily.customTargetArch=powerpc
sonar.cfamily.customTargetVendor=unknown
sonar.cfamily.customTargetSystem=unknown
sonar.cfamily.customTargetEnv=eabi

# cc370 predefines __MVS__; analyze the code paths the MVS build compiles.
sonar.cfamily.customPreprocessor=#define __MVS__ 1

# The Python here (scripts/mvstest.py) runs on mbt, which needs 3.12+.
sonar.python.version=3.12

# Test code: the REXX suite and its runner. Declared as tests and kept out
# of the sources, so the production rules do not run on them.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test/**,scripts/mvstest.py

# Not analysable as source and not UTF-8 on purpose: sysmac/ holds IBM
# SYS1.MACLIB/AMODGEN members whose Latin-1 0xAC is the not sign as370
# reads (EBCDIC X'5F', #187); progs/banner.r carries banner bytes.
# Converting them to UTF-8 would change what the build reads.
sonar.exclusions=test/**,scripts/mvstest.py,sysmac/**,progs/banner.r
