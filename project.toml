[project]
name = "brexx370"
version = "3.0.0-dev"
type = "application"

[toolchain]
# The libc370 the MVS test run (mvs-test.yml) and a release build against:
# the release tag v2.0.0. build.yml follows libc370 main, which carries
# the 2.0 line, so a cc370/libc370 regression shows up in a PR build.
libc370 = "2.1.0"

[build]
# The sources were written for JCC. compat/jccompat.h is force-included into
# every translation unit: it maps the JCC runtime API onto libc370 and makes
# the 8-character external-name renames (inc/rxmvs.h) apply everywhere.
cflags = [
  "-std=gnu99",
  "-I",
  "inc",
  "-I",
  "compat",
  "-I",
  "cross",
  "-I",
  "rac",
  "-I",
  "dynit",
  "-I",
  "fss",
  "-I",
  "map",
  "-I",
  "regex",
  "-Wall",
  "-Wextra",
  "-Werror",
  "-include",
  "compat/jccompat.h",
]
# maclib/  BREXX macros (+ minimal IF/ELSEIF/ELSE/ENDIF/DO/ENDDO)
# asm/     COPY members used by the assembler modules
# sysmac/  IBM SYS1.MACLIB/AMODGEN members not shipped with libc370
asflags = ["-I", "maclib", "-I", "asm", "-I", "sysmac"]

# ── The interpreter ─────────────────────────────────────────────
# BREXX links the C interpreter with the RXMVSEXT assembler routines.
[[module]]
name = "BREXX"
aliases = ["REXX", "RX"] # neither is an external symbol in BREXX
startup = "crt1" # threads (NJE38 subtask) need crt1
ac = 1
# Neither reentrant nor serially reusable: C statics keep their values
# between runs of one copy. ld370 marks every module RENT+REUS unless told
# otherwise, and --norent alone left BREXX REUS; 2.5.3 was NOREUS (IEWL's
# default). A kept copy was then reused with the state of an aborted run
# (#183: rac_check's cache pointed into a freed heap, S0C9).
norent = true
noreus = true
sources = [
  "src/*.c",
  "lstring/*.c",
  "rac/*.c",
  "dynit/*.c",
  "fss/*.c",
  "map/*.c",
  "regex/*.c",
  "compat/*.c",
  "asm/rxsvc.asm",
  "asm/rxabend.asm",
  "asm/rxikj441.asm",
  "asm/rxinit.asm",
  "asm/rxterm.asm",
  "asm/rxtsoa.asm",
  "asm/rxvsam.asm",
  "asm/rxcputim.asm",
  "asm/rxcpcmd.asm",
  "asm/rxestae.asm",
]

# ── Standalone assembler modules ───────────────────────────────
[[module]]
name = "IRXVTOC"
entry = "VTOCCMD"
startup = false
sources = ["asm/vtoc*.asm"]

[[module]]
name = "IRXVSMIO"
entry = "VSIOMOD"
startup = false
sources = ["asm/rxvsmio1.asm"]

[[module]]
name = "IRXVSMTR"
entry = "VSIOMOD"
startup = false
sources = ["asm/rxvsmio2.asm"]

[[module]]
name = "IRXISTAT"
entry = "RXPDSTAT"
startup = false
sources = ["asm/rxpdstat.asm"]

[[module]]
name = "MVSDUMP"
entry = "MVSDUMP"
startup = false
sources = ["asm/mvsdump.asm"]

[release]
version_files = ["VERSION"]

# ── Test helpers (TESTLIB only, never shipped) ─────────────────
# A program that writes into its parameters, for test/addrlink.rexx (#102).
# scripts/mvstest.py puts the TESTLIB behind the LINKLIB when it exists.
[[test]]
name = "TSTLINK"
entry = "TSTLINK"
startup = false
sources = ["test/tstlink.asm"]

# A program that abends S0C1 when LINKMVS passes 'ABND' (test/lnkabnd.rexx,
# test/privabnd.rexx, #191); RC 0 for a single parameter (make test-mvs).
[[test]]
name = "TSTABND"
entry = "TSTABND"
startup = false
sources = ["test/tstabnd.asm"]
