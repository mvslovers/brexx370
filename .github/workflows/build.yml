# Host build with mbt 3 + cc370 (no MVS involved), and the manuals.
#
# build  mbt's reusable build3.yml: cc370 and libc370 from main, so a
#   toolchain regression shows up in a PR build; mbt.toml pins the release.
#
# books  ML03-0001..0003 (docs/books), with typst pinned by version AND
#   sha256 as in .readthedocs.yaml, so a broken reference, label or syntax
#   diagram fails the PR instead of the Read the Docs build after the merge.
#   Builds the PDFs and the web form (web/build.sh, what Read the Docs runs);
#   the PDFs go up as the artifact `books`. The fonts come from the
#   bookmaster submodule. The same job as libc370's and cc370's (cc370#893).
#
# libs   RXLIB and SAMPLIB as the SMP package takes them (scripts/stagelibs.py,
#   `mbt run libcheck`): lines over 80 columns, characters without a CP037
#   equivalent, IBM and duplicate member names fail the PR that adds them, and
#   so does a comma at the end of a line that joins two arguments
#   (scripts/rexxcont.py, #513).
name: Build (cc370)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    uses: mvslovers/mbt/.github/workflows/build3.yml@main

  libs:
    name: RXLIB and SAMPLIB (stagelibs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the members
        run: python3 scripts/stagelibs.py --check-only

      - name: Check the line-end commas
        run: python3 scripts/rexxcont.py

      - name: Test the comma checker
        run: python3 -m unittest scripts/test_rexxcont.py

  books:
    name: manuals (typst)
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: 0.15.1
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install typst (pinned)
        run: |
          f=typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL --proto "=https" --tlsv1.2 -O "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/$f"
          echo "$TYPST_SHA256  $f" | sha256sum -c -
          tar xf "$f"
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Build the manuals (PDF)
        run: make -C docs/books

      - name: Build the web form (as Read the Docs does)
        run: make -C docs/books site

      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: docs/books/*.pdf
          if-no-files-found: error
