# Build with mbt 3 + cc370, deploy into an MVS/CE container and run BREXX
# there.
#
# The MVS/CE image serves mvsMF on port 8080; mbt takes it as its target
# from MBT_TARGET_*. 'mbt deploy' writes the LINKLIB (BREXX370.DEV.LINKLIB,
# the mbt 3 default), 'mbt run mvstest' (mbt/init.lua, scripts/mvstest.py)
# runs a smoke test and the REXX test suite from test/ as batch steps.
name: MVS test (cc370)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  MBT_TARGET_MVSMF_URL: http://localhost:8080
  MBT_TARGET_MVSMF_USER: IBMUSER
  MBT_TARGET_MVSMF_PASSWORD: sys1
  MBT_TARGET_HLQ: IBMUSER
  # MVS/CE's NJE38 RECEIVE needs an explicit volume
  MBT_TARGET_VOLUME: PUB000

jobs:
  mvs-test:
    runs-on: ubuntu-latest

    services:
      mvs:
        image: ghcr.io/mvslovers/mvsce-builder:latest
        ports:
          - 3270:3270
          - 8080:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install mbt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest mbt 3 release (as build3.yml); it switches to the one
          # mbt.toml pins by itself
          TAG=$(gh release list -R mvslovers/mbt --limit 100 --json tagName,isDraft \
                --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("v3."))][0]')
          [ -n "$TAG" ] || { echo "no mbt 3 release on mvslovers/mbt" >&2; exit 3; }
          VER="${TAG#v}"
          cd "$RUNNER_TEMP"
          gh release download "$TAG" -R mvslovers/mbt -p "mbt-$VER-linux-amd64.tar.gz" -p "mbt-$VER-sha256.txt"
          sha256sum -c --ignore-missing "mbt-$VER-sha256.txt"
          tar -xzf "mbt-$VER-linux-amd64.tar.gz"
          # not ~/.local: the toolchain cache restores that directory
          install -D "mbt-$VER-linux-amd64/mbt" "$HOME/.mbt-bin/mbt"
          echo "$HOME/.mbt-bin" >> "$GITHUB_PATH"

      - name: Clone toolchain (cc370 main + libc370 at the [toolchain] ref)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # mbt ci-info: LIBC370_REF is the tag of the version mbt.toml pins
          REF=$(mbt ci-info | sed -n 's/^LIBC370_REF=//p')
          echo "libc370 ref: $REF"
          git clone --depth 1 https://github.com/mvslovers/cc370.git /tmp/cc370
          git clone --depth 1 --branch "$REF" https://github.com/mvslovers/libc370.git /tmp/libc370
          echo "TC_KEY=$(git -C /tmp/cc370 rev-parse HEAD)-$(git -C /tmp/libc370 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache toolchain
        id: tc-cache
        uses: actions/cache@v5
        with:
          path: ~/.local
          key: cc370-mvstest-${{ runner.os }}-${{ env.TC_KEY }}

      - name: Build + install toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex
          make -C /tmp/cc370 install PREFIX="$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          make -C /tmp/libc370 install

      - name: Add cc370 to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mbt build --all

      - name: Wait for MVS IPL (mvsMF)
        run: |
          # a healthy IPL answers within seconds; stop as soon as the
          # container is gone instead of waiting out the timeout (#277).
          # "Dump MVS container logs" keeps the full log, Hercules log
          # and console hardcopy included.
          C=$(docker ps -aq --filter "ancestor=ghcr.io/mvslovers/mvsce-builder:latest")
          for i in $(seq 1 300); do
            if curl -sf -u "$MBT_TARGET_MVSMF_USER:$MBT_TARGET_MVSMF_PASSWORD" "$MBT_TARGET_MVSMF_URL/zosmf/info" >/dev/null 2>&1; then
              echo "mvsMF ready after ~${i}s"; exit 0
            fi
            state=$(docker inspect -f '{{.State.Status}}' "$C")
            if [ "$state" != running ]; then
              echo "MVS container is $state after ${i}s"; exit 1
            fi
            sleep 1
          done
          echo "mvsMF not ready after 300s"
          exit 1

      - name: Deploy
        run: mbt deploy -v

      - name: Smoke test
        run: mbt run mvstest -- --smoke-only --dump --print-spool

      - name: REXX test suite
        run: mbt run mvstest -- --print-spool

      - name: Dump MVS container logs
        if: always()
        run: |
          docker logs $(docker ps -aq --filter "ancestor=ghcr.io/mvslovers/mvsce-builder:latest") \
            > build/mvs-docker.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # one artifact per attempt: a rerun must not overwrite the
          # evidence of the failed one (#277)
          name: mvs-test-logs-${{ github.run_attempt }}
          path: |
            build/mvstest.spool
            build/mvs-docker.log
            dist/
          if-no-files-found: ignore
