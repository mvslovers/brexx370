name: Release

# A tag v* builds with the toolchain pinned in project.toml ([toolchain]),
# runs `make package` and publishes dist/* as a GitHub Release; a tag with
# a '-' (v3.0.0-dev) becomes a prerelease. mbt's reusable workflow, as in
# ufsd. The JCC release workflow lives on in the branch v2.5-jcc.
#
# The TSO usermod (tso/, ZMG0001) is not part of dist/. The job zmg0001
# attaches it afterwards (#364): ZMG0001.smp, built by tso/usermod.py from
# the committed decks in tso/usermod/, and ZMG0001-jobs.zip with tso/jcl.
# It runs after the release job, which deletes and recreates the release
# when a tag is pushed again, so a renewed prerelease keeps both assets.
#
# The job books runs last: it builds the manuals ML03-0001..0003 from the
# tag (typst pinned as in build.yml and .readthedocs.yaml), attaches them
# as ml03-000N-E.pdf, and writes SHA256SUMS over every asset of the
# release, the packages and the usermod included.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: mvslovers/mbt/.github/workflows/release.yml@main

  zmg0001:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write          # upload the release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the usermod stream
        run: |
          python3 tso/usermod.py ZMG0001
          sha256sum build/tso/ZMG0001.smp

      - name: Pack the jobs
        run: |
          cd tso/jcl
          zip -q -X ../../build/tso/ZMG0001-jobs.zip ZMG01*.jcl
          unzip -l ../../build/tso/ZMG0001-jobs.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            build/tso/ZMG0001.smp build/tso/ZMG0001-jobs.zip

  books:
    needs: zmg0001
    runs-on: ubuntu-latest
    permissions:
      contents: write          # upload the release assets
    env:
      TYPST_VERSION: 0.15.1
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install typst (pinned)
        run: |
          f=typst-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL --proto "=https" --tlsv1.2 -O "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/$f"
          echo "$TYPST_SHA256  $f" | sha256sum -c -
          tar xf "$f"
          sudo install -m 755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst

      - name: Build the manuals
        run: |
          make -C docs/books
          ls -l docs/books/ml03-*.pdf

      - name: Attach the manuals and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber docs/books/ml03-*.pdf
          mkdir -p sums
          gh release download "$GITHUB_REF_NAME" --dir sums --pattern '*' --clobber
          rm -f sums/SHA256SUMS
          (cd sums && sha256sum * > SHA256SUMS && cat SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" --clobber sums/SHA256SUMS

