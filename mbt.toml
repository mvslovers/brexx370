schema = 3

[project]
name = "brexx370"
version = "3.0.0-dev"
kind = "application"

[toolchain]
# mbt 3.0.0-rc2: the first release with ++MAC/++SRC elements over TXLIB
# (mvslovers/mbt#310); an installed mbt switches to it (MIGRATION.md, section 1).
mbt = "3.0.0-rc2"
# The libc370 the MVS test run (mvs-test.yml) and a release build against.
# build.yml follows libc370 main, so a cc370/libc370 regression shows up in
# a PR build. Why each level was needed:
# 2.3.1: the C runtime startup is a member of libc.a from 2.3.0 on,
# so no module names a startup object (mvslovers/mbt#158). An older libc.a
# would quietly link crt0 where these modules used to have crt1. 2.3.1
# rather than 2.3.0 for the subtask cleanup fix (mvslovers/libc370#431).
# 2.4.1: the startup hook __premain() (2.4.0) sets the standard streams
# (#251); with an older libc.a it is never called. 2.4.x needs cc370 1.4.
# 2.5.0: fopen("*PUTLINE") for stdout/stderr under a TMP (libc370#463);
# before 2.5.0 that name allocates a SYSOUT of its own everywhere.
# 2.6.0: fopen("*GETLINE") for stdin under a TMP (libc370#467).
# 2.6.2: fseek() inside the buffer of an "r" stream (libc370#473): a
# rewind after the first record pointed before the buffer, and LINEIN at
# a line number read the wrong line depending on the module layout (#380).
# 2.6.3: rand() returns 0..RAND_MAX; it gave only 0..4095 and
# 32768..36863, so RANDOM was unevenly spread (libc370#387, #386).
# 2.8.1: the IBM system macros come from maclib370, which cc370 1.6.0's
# as370 finds without -I; fclose()'s close routine at the TK5 level of
# FREEPOOL (2.8.0). Needs cc370 >= 1.6.0 (#426).
# 2.28.0: the 3.0.0 baseline (#441). Requires cc370 >= 1.6.0, < 2 and
# maclib370 >= 1.0.0, < 2; cc370 1.6.3 is the release this is tested with.
cc370 = "1.6.3"
libc370 = "2.28.0"

[build]
# mbt adds -Wall -Wextra -Werror itself: a new warning fails the build (#167).
# inc/mvsnames.h is force-included into every translation unit: the
# 8-character external-name renames (inc/lmvs.h, inc/rxmvs.h) must apply
# everywhere.
include = ["inc", "cross", "rac", "dynit", "fss", "map", "regex"]
cflags = ["-std=gnu99", "-include", "inc/mvsnames.h"]
# maclib/  BREXX macros (+ minimal IF/ELSEIF/ELSE/ENDIF/DO/ENDDO), and
#          YREGS, which maclib370 does not have
# asm/     COPY members used by the assembler modules
# The IBM system macros come from maclib370 in the sysroot, which as370
# finds without -I (cc370 >= 1.6.0); sysmac/ went with #429.
asflags = ["-I", "maclib", "-I", "asm"]

# ── The interpreter ─────────────────────────────────────────────
# BREXX links the C interpreter with the RXMVSEXT assembler routines.
[module.BREXX]
aliases = ["REXX", "RX"] # neither is an external symbol in BREXX
ac = 1
# Neither reentrant nor serially reusable: C statics keep their values
# between runs of one copy, as in 2.5.3 (NORENT, IEWL's default NOREUS).
# A REUS copy was reused with the state of an aborted run (#183:
# rac_check's cache pointed into a freed heap, S0C9). 2.5.3 shipped this
# NORENT AC=1 module in an APF library and wrote its statics there; the
# key-0 subpool 252 of ufsd#64 is where fetch puts reentrant modules.
rent = false
reus = false
sources = [
  "src/*.c",
  "lstring/*.c",
  "rac/*.c",
  "dynit/*.c",
  "fss/*.c",
  "map/*.c",
  "regex/*.c",
  "asm/rxsvc.asm",
  "asm/rxabend.asm",
  "asm/rxtsoa.asm",
  "asm/rxvsam.asm",
  "asm/rxcputim.asm",
  "asm/rxcpcmd.asm",
  "asm/rxestae.asm",
]

# ── Standalone assembler modules ───────────────────────────────
[module.IRXVTOC]
entry = "VTOCCMD"
startup = false
# Reentrant: every store goes into the work area VTCENTER GETMAINs, the
# DCBs are copied from models and opened MF=E there. 2.5.3 linked it
# RENT,REUS,REFR and assembled it with RENT.
rent = true
reus = true
refr = true
sources = ["asm/vtoc*.asm"]

[module.IRXVSMIO]
entry = "VSIOMOD"
startup = false
# Not reentrant: the standard-form ESTAE, MODCB/SHOWCB, OPEN and CLOSE
# build their parameter lists inside the CSECT. Each is rebuilt right
# before its SVC, and the per-file state is GETMAINed, so a copy can be
# reused. 2.5.3 linked it with no attributes (ASMFCL).
rent = false
reus = true
sources = ["asm/rxvsmio1.asm"]

[module.IRXVSMTR]
entry = "VSIOMOD"
startup = false
# Not reentrant: the standard-form ESTAE, MODCB/SHOWCB, OPEN and CLOSE
# build their parameter lists inside the CSECT. Each is rebuilt right
# before its SVC, and the per-file state is GETMAINed, so a copy can be
# reused. IRXVSMIO's source with tracing; 2.5.3 linked it with no
# attributes (ASMFCL).
rent = false
reus = true
sources = ["asm/rxvsmio2.asm"]

# ── The SMP package (#273) ─────────────────────────────────────
[distribution]
readme = "README.md"

[smp]
# TBRX300, derived from the version: one FMID per minor release, spent
# exactly once. 3.0.0 is the first level, so it replaces nothing. A patch
# release needs an explicit fmid and delete; the next minor must name that
# id in delete (the ownership wall, .workspace/context/smp.md). No version
# component may exceed 9.
prefix = "TBRX"
delete = []
prereq = []
# BREXX runs unauthorized: BREXX.LINKLIB gets no APF entry (#273).
lklib  = "BREXX.BRXLOAD"
target = "BREXX.LINKLIB"
distlib = "BREXX.ABRXLOD"

# RXLIB and SAMPLIB are ++MAC elements. scripts/stagelibs.py checks the
# members and writes the ones to deliver to build/stage/ (the stage-libs
# task of mbt/init.lua runs before package and dist).
[distribution.library."build/stage/rxlib"]
element = "MAC"
target  = "BREXX.RXLIB"
distlib = "BREXX.ARXLIB"
stage   = "BREXX.TRXLIB"

[distribution.library."build/stage/samples"]
element = "MAC"
target  = "BREXX.SAMPLIB"
# Not ASAMPLIB: the SMPAPP procedure of MVS/CE has a DD of that name and TK5's
# has none, and no order of the override cards is right on both.
distlib = "BREXX.ABRXSAM"
stage   = "BREXX.TSAMPLIB"

# Outside SMP: received as plain data sets.
[distribution.library.jcl]
target = "BREXX.JCL"

[distribution.library.proclib]
target = "BREXX.PROCLIB"

[distribution.library.cmdlib]
target = "BREXX.CMDLIB"

# ── Test helpers (TESTLIB only, never shipped) ─────────────────
# Defaults for every test; test/**/*.c and *.asm are tests unless excluded.
[tests]
rent = true
reus = true

# A program that writes into its parameters, for test/addrlink.rexx (#102).
# scripts/mvstest.py puts the TESTLIB behind the LINKLIB when it exists.
[test.TSTLINK]
entry = "TSTLINK"
startup = false
# Stores only into the caller's save area and parameters.
rent = true

# A program that abends S0C1 when LINKMVS passes 'ABND' (test/lnkabnd.rexx,
# test/privabnd.rexx, #191); RC 0 for a single parameter (make test-mvs).
[test.TSTABND]
entry = "TSTABND"
startup = false
# Stores only into the caller's save area and parameters.
rent = true

# The authorization of the job step after an abend that took the stack
# frame of the holder (test/njeabend.rexx, #505): privilege.c and what it
# needs, linked into the test. Runs RxNoPriv() as main() does after the
# ESTAE returned.
[test.TSTAUTH]
sources = ["test/tstauth.c", "src/privilege.c", "rac/rac.c", "map/hashmap.c", "map/hashing.c", "map/list.c", "asm/rxsvc.asm"]
# Writable statics (privilege.c, rac.c): NORENT, and a fresh copy per run.
rent = false
reus = false

# An external function that describes its argument table, for
# test/extfun.rexx (#386). Writes a doubleword in its CSECT: NORENT.
[test.TSTEFUN]
entry = "TSTEFUN"
startup = false
rent = false
reus = false

# ── Interactive tests (mbt test --tso, test/tso/*.lua) ─────────
# FSSMENU needs a 3270; the execs and the RXLIB members it calls are loaded
# into HLQ.BREXX370.FIX.FSSMENU.<KEY> before the session (#422).
# A table, not an inline one over several lines: scripts/mvstest.py reads
# this file with Python's tomllib (TOML 1.0), which refuses that.
[tso.FSSMENU.fixtures]
TSOTEST = ["test/tso/menutst.rexx", "test/tso/menuopt.rexx",
           "test/tso/menunot.rexx"]
RXLIB   = ["rxlib/FSSMENU.rexx", "rxlib/FSSAPI.rexx"]

# JESQUEUE's spool list and its S line command (#487): JESQSUB submits the
# jobs, JES2 is the spool viewer sample (installed as JES2SPL).
[tso.JESQUEUE.fixtures]
TSOTEST = ["test/tso/jesqsub.rexx", "samples/JES2.rexx"]
RXLIB   = ["rxlib/FMTLIST.rexx", "rxlib/FSSAPI.rexx", "rxlib/JESQUEUE.rexx"]

# The FMTOPBOT sample: FMTLIST with call back procedures for the top lines
# and the footer (#513).
[tso.FMTOPBOT.fixtures]
TSOTEST = ["samples/FMTOPBOT.rexx"]
RXLIB   = ["rxlib/FMTLIST.rexx", "rxlib/FSSAPI.rexx"]

# The JES2 primary option menu on an 80x24 screen (#514).
[tso.JESQMENU]
size = "80x24"

[tso.JESQMENU.fixtures]
TSOTEST = ["samples/JESQUEUE.rexx"]
RXLIB   = ["rxlib/FSSAPI.rexx", "rxlib/FMTLIST.rexx", "rxlib/JESQUEUE.rexx"]
